name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish the current feature branch before it is merged.
  workflow_dispatch:

# GITHUB_TOKEN permissions required by the Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deployment: an interrupted publish can leave the site
# serving a half-updated asset set.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Publishing a build that fails its own checks would put a broken app on
      # a phone home screen, where the service worker then caches it.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `enablement: true` turns Pages on via the API if it is not already
      # enabled, instead of failing with "Get Pages site failed / Not Found" and
      # requiring someone to click through repository settings first. It is a
      # no-op once Pages is on. If the token is not permitted to enable Pages
      # (some org policies forbid it), this still fails clearly and the manual
      # route — Settings > Pages > Source: GitHub Actions — remains available.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
